<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiRed · Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra-superior">
      <span class="marca">LogiRed</span>
      <div class="persona">
        <span><strong id="nombre-usuario"></strong> <span class="rol" id="rol-usuario"></span></span>
        <button id="cerrar-sesion" type="button">Cerrar sesión</button>
      </div>
    </div>
    <nav id="menu" aria-label="Secciones"><a href="clientes.html" aria-current="page">Clientes</a><a href="vehiculos.html">Vehículos</a><a href="perfil.html">Mi perfil</a></nav>
  </header>

  <main>
    <div class="cabecera-seccion">
      <div>
        <h1>Clientes</h1>
        <p class="resumen" id="resumen">Cargando…</p>
      </div>
      <div class="herramientas">
        <input type="search" id="filtro-ciudad" placeholder="Filtrar por ciudad" aria-label="Filtrar por ciudad">
        <button class="boton boton-suave" id="buscar" type="button">Buscar</button>
        <button class="boton" id="nuevo" type="button">Crear cliente</button>
      </div>
    </div>
    <div class="tabla-envoltura">
      <table class="tabla">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col">Documento</th>
            <th scope="col">Teléfono</th>
            <th scope="col">Email</th>
            <th scope="col">Ciudad</th>
            <th scope="col"><span class="oculto">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>
  <div id="mensajes"></div>
  <dialog id="dialogo"></dialog>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LogiRed · Gestión de envíos</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="barra">
    <div class="barra-superior">
      <span class="marca">LogiRed</span>
      <div class="persona">
        <span id="info-usuario"></span>
        <button id="btn-salir" type="button">Cerrar sesión</button>
      </div>
    </div>
    <nav id="menu" aria-label="Secciones"></nav>
  </header>

  <main>
    <div class="cabecera-seccion">
      <div>
        <h1>Envíos</h1>
        <p class="resumen">Registre y siga el estado de cada envío.</p>
      </div>
    </div>

    <!-- Caja para mostrar errores 400, 403, 409, 503 -->
    <div id="mensaje-error" class="mensaje mensaje-error" style="display:none; margin-bottom:1rem;"></div>

    <!-- Formulario para crear / editar (se oculta si el rol es flota) -->
    <section id="seccion-formulario" class="tarjeta-form">
      <h2 id="titulo-form">Nuevo envío</h2>
      <form id="form-envio" class="form-envio">
        <input type="hidden" id="envio-id" />
        <input type="text" id="codigo" placeholder="Código (ej: ENV-010)" required />
        <input type="text" id="origen" placeholder="Origen (ej: Cali)" required />
        <input type="text" id="destino" placeholder="Destino (ej: Bogotá)" required />
        <select id="estado">
          <option value="pendiente">pendiente</option>
          <option value="en transito">en transito</option>
          <option value="entregado">entregado</option>
        </select>
        <input type="number" id="cliente_id" placeholder="ID del cliente" min="1" required />
        <input type="number" id="peso" placeholder="Peso (kg)" min="1" step="0.1" value="10" required />
        <button type="submit" id="btn-guardar" class="boton">Guardar envío</button>
      </form>
    </section>

    <!-- Tabla de envíos -->
    <div class="tabla-envoltura">
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>Estado</th>
            <th>Cliente (ms-clientes)</th>
            <th id="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-envios"></tbody>
      </table>
    </div>
  </main>

  <!-- Scripts en orden: config, sesion (menú), api y al final envios -->
  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/envios.js"></script>
  <script>
    // Menú común según el rol (el mismo de Clientes y las demás pantallas)
    const _usuarioMenu = usuarioActual();
    if (_usuarioMenu) pintarMenu(_usuarioMenu);
  </script>
</body>
</html>

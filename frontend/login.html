<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logired · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="entrada">
    <section class="sala">
      <div>
        <h1>Logired</h1>
        <p>Envíos, inventario y rutas de su operación logística, en un solo lugar.</p>
      </div>
      <!-- Decoración: pilas de contenedores y estibas, con la misma estructura del estante original -->
      <div class="estante-deco" aria-hidden="true">
        <span style="background:#1f3a5f;height:92%">Almacenamiento</span>
        <span style="background:#c8661a;height:78%">Distribución</span>
        <span style="background:#2f6f6a;height:64%">Transporte terrestre</span>
        <span style="background:#1f3a5f;height:86%">Carga consolidada</span>
        <span style="background:#7a8793;height:70%">Cross-docking</span>
        <span style="background:#c8661a;height:96%">Última milla</span>
        <span style="background:#2f6f6a;height:74%">Trazabilidad</span>
        <span style="background:#1f3a5f;height:82%">Inventarios</span>
        <span style="background:#7a8793;height:68%">Despachos</span>
        <span style="background:#c8661a;height:90%">Rutas</span>
        <span style="background:#2f6f6a;height:60%">Aduanas</span>
      </div>
    </section>

    <section class="acceso">
      <form id="form-login" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="indicacion">Use el email y la contraseña de su cuenta Logired.</p>
        <label class="campo"><span>Email</span>
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label class="campo"><span>Contraseña</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="boton" type="submit">Entrar</button>
        <p class="error-acceso" id="error-login" role="alert"></p>

      </form>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const error = document.getElementById('error-login');

    // Si ya hay sesión, ir directo a la página del rol
    const yaEntro = usuarioActual();
    if (yaEntro) location.href = PAGINA_POR_ROL[yaEntro.rol];


    form.onsubmit = async (evento) => {
      evento.preventDefault();
      error.textContent = '';
      const email = form.elements.email.value.trim();
      const password = form.elements.password.value;
      if (!email || !password) {
        error.textContent = 'Escriba el email y la contraseña.';
        return;
      }
      try {
        await iniciarSesion(email, password);
      } catch (e) {
        error.textContent = e.status === 401 ? 'Email o contraseña incorrectos.' : e.message;
      }
    };
  </script>
</body>
</html>

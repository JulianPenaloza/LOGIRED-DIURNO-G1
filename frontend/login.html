<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logired · Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="entrada">
    <section class="sala">
      <div>
        <h1>Logired</h1>
        <p>Envíos, inventario y rutas de su operación logística, en un solo lugar.</p>
      </div>
      <!-- Decoración: ruta recta; al llegar el camión aparece una caja -->
<div class="ruta-deco" aria-hidden="true">
        <svg viewBox="-60 0 700 230" xmlns="http://www.w3.org/2000/svg" id="mapa-ruta">
          <path d="M30,110 L610,110" fill="none" stroke="#0e151c" stroke-width="30" stroke-linecap="round"/>
          <path id="ruta" d="M30,110 L540,110" fill="none" stroke="#f2b705" stroke-width="3" stroke-dasharray="16 13"/>
          <path d="M540,110 L610,110" fill="none" stroke="#f2b705" stroke-width="3" stroke-dasharray="16 13"/>
          <g fill="#1b2530" stroke="#fff" stroke-width="4">
            <circle cx="30" cy="110" r="10"/><circle cx="200" cy="110" r="10"/><circle cx="370" cy="110" r="10"/><circle cx="540" cy="110" r="10"/>
          </g>
          <g text-anchor="middle">
            <text class="ciudad" x="30" y="165">Buenaventura</text><text class="ciudad-nota" x="30" y="185">Puerto</text>
            <text class="ciudad" x="200" y="165">Cali</text><text class="ciudad-nota" x="200" y="185">Centro de distribución</text>
            <text class="ciudad" x="370" y="165">Medellín</text><text class="ciudad-nota" x="370" y="185">Hub regional</text>
            <text class="ciudad" x="540" y="165">Bogotá</text><text class="ciudad-nota" x="540" y="185">Destino</text>
          </g>
          <g>
            <rect x="-26" y="-13" width="34" height="24" rx="2" fill="#2f5d7c"/>
            <rect x="10" y="-9" width="16" height="20" rx="2" fill="#f2b705"/>
            <rect x="18" y="-6" width="6" height="7" fill="#1b2530"/>
            <circle cx="-16" cy="12" r="4.5" fill="#fff"/><circle cx="18" cy="12" r="4.5" fill="#fff"/>
            <animateMotion rotate="auto" dur="8s" begin="0.5s" fill="freeze"><mpath href="#ruta"/></animateMotion>
          </g>
          <!-- La cajita aparece cuando el camión llega -->
          <g opacity="0">
            <animate attributeName="opacity" from="0" to="1" begin="8.5s" dur="0.2s" fill="freeze"/>
            <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 0" begin="8.5s" dur="0.4s" fill="freeze"/>
            <rect x="580" y="72" width="34" height="30" rx="2" fill="#c98a3b" stroke="#8a5a1c" stroke-width="2"/>
            <rect x="594" y="72" width="6" height="30" fill="#f2d39a"/>
            <rect x="580" y="82" width="34" height="5" fill="#8a5a1c" opacity="0.35"/>
          </g>
        </svg>
      </div>
      <script>
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          var s = document.getElementById('mapa-ruta'); s.pauseAnimations(); s.setCurrentTime(10);
        }
      </script>
    </section>

    <section class="acceso">
      <form id="form-login" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="indicacion">Use el email y la contraseña de su cuenta Logired.</p>
        <label class="campo"><span>Email</span>
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label class="campo"><span>Contraseña</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="boton" type="submit">Entrar</button>
        <p class="error-acceso" id="error-login" role="alert"></p>

      </form>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const error = document.getElementById('error-login');

    // Si ya hay sesión, ir directo a la página del rol
    const yaEntro = usuarioActual();
    if (yaEntro) location.href = PAGINA_POR_ROL[yaEntro.rol];


    form.onsubmit = async (evento) => {
      evento.preventDefault();
      error.textContent = '';
      const email = form.elements.email.value.trim();
      const password = form.elements.password.value;
      if (!email || !password) {
        error.textContent = 'Escriba el email y la contraseña.';
        return;
      }
      try {
        await iniciarSesion(email, password);
      } catch (e) {
        error.textContent = e.status === 401 ? 'Email o contraseña incorrectos.' : e.message;
      }
    };
  </script>
</body>
</html>
